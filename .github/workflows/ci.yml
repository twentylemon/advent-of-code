name: CI
on:
  push:
jobs:
  scala:
    strategy:
      matrix:
        package: [lib, year2015, year2016, year2022, year2023, year2024, year2025]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: 17
    - uses: sbt/setup-sbt@v1
    - uses: sliteteam/github-action-git-crypt-unlock@1.3.0
      env:
        GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
    - run: sbt -v "testOnly org.lemon.advent.${{ matrix.package }}.*"

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: 17
    - uses: sbt/setup-sbt@v1
    - run: sbt -v "scalafmtCheckAll; scalafmtSbtCheck"

  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - uses: sliteteam/github-action-git-crypt-unlock@1.3.0
      env:
        GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
    - run: pip install -r requirements.txt
    - run: black --check .
    - run: pytest
